name: CI

# รันอัตโนมัติทุก push ขึ้น branch หลัก + ทุก Pull Request → จับ bug ก่อน merge
on:
  push:
    branches: [ main, mes, 'feat/**' ]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend        # โค้ด frontend อยู่ในโฟลเดอร์ frontend/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test

      - name: Production build
        run: npm run build
